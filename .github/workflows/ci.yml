name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pytest checkpoints
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-dummy
      REDIS_URL: fake://
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CP1-CP4
        run: >-
          python -m pytest
          tests/test_cp1.py
          tests/test_cp2.py
          tests/test_cp3.py
          tests/test_cp4.py
          -v

  build:
    name: Build production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy or validate fallback
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Railway when configured
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install --global @railway/cli
          railway up --detach
      - name: Record Local Fallback mode
        if: env.RAILWAY_TOKEN == ''
        run: echo "Cloud token is not configured; validated Local Fallback artifacts."
      - name: Smoke test cloud service
        if: env.RAILWAY_TOKEN != '' && env.PUBLIC_URL != ''
        run: |
          sleep 45
          curl --fail --silent --show-error "${PUBLIC_URL}/health"
